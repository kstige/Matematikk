name: Deploy Matematikk

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build and Assemble Site
        run: |
          mkdir -p _site/1T _site/R1 _site/R2

          # Bygg 1T
          cd 1T && uvx jupyter-book build --html && cd ..
          cp -r 1T/_build/site/* _site/1T/

          # Bygg R1
          cd R1 && uvx jupyter-book build --html && cd ..
          cp -r R1/_build/site/* _site/R1/

          # Bygg R2
          cd R2 && uvx jupyter-book build --html && cd ..
          cp -r R2/_build/site/* _site/R2/

          # Lag hoved-forsiden
          cat > _site/index.html <<EOF
          <!DOCTYPE html>
          <html>
            <head><meta charset="utf-8"><title>Matematikk</title></head>
            <body style="font-family: sans-serif; padding: 50px; max-width: 800px; margin: auto;">
              <h1>Matematikkressurser</h1>
              <hr>
              <ul>
                <li><a href="1T/">Matematikk 1T</a></li>
                <li><a href="R1/">Matematikk R1</a></li>
                <li><a href="R2/">Matematikk R2</a></li>
              </ul>
            </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4