name: Deploy Matematikk-sider

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true # Prøver cache igjen, 400-feilen er ofte forbigående

      - name: Build and Organize Books
        run: |
          mkdir -p _site/1T _site/R1 _site/R2
          
          # Vi bruker 'uvx' (uv extension) for å kjøre jupyter-book uten 
          # å måtte installere den manuelt i miljøet først. Lynraskt!
          
          cd 1T && uvx jupyter-book build --html && cp -r _build/site/* ../_site/1T/ && cd ..
          cd R1 && uvx jupyter-book build --html && cp -r _build/site/* ../_site/R1/ && cd ..
          cd R2 && uvx jupyter-book build --html && cp -r _build/site/* ../_site/R2/ && cd ..

      - name: Create Index
        run: |
          cat > _site/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><title>Matematikkfag</title></head>
          <body style="font-family: sans-serif; max-width: 800px; margin: 40px auto; line-height: 1.6;">
            <h1>Matematikkressurser</h1>
            <ul>
              <li><a href="1T/">Matematikk 1T</a></li>
              <li><a href="R1/">Matematikk R1</a></li>
              <li><a href="R2/">Matematikk R2</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4