name: Deploy MyST Site

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        run: uv python install

      - name: Install MyST
        run: uv pip install mystmd

      - name: Build Site
        # Denne kommandoen bygger alle prosjektene definert i myst.yml
        run: uv run myst build --html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_build/html'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4